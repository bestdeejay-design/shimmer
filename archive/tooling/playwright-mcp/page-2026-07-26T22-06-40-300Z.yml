      - text: ": Russian."
  - heading [level=3] [ref=f20e63]:
    - text: Lore Files
    - link "Anchor" [ref=f20e64] [cursor=pointer]:
      - /url: "#lore-files"
      - text: 
  - paragraph [ref=f20e65]: Seven reference documents covering the Psi-Stream, Shimmer mechanics, the Galactic Clock, the Architects, and the structure of the universe.
