- generic [ref=f20e2]:
  - heading [level=1] [ref=f20e3]:
    - link "shimmer" [ref=f20e4] [cursor=pointer]:
      - /url: https://bestdeejay-design.github.io/shimmer/
  - heading "Shimmer" [level=1] [ref=f20e5]
  - blockquote [ref=f20e6]:
    - paragraph [ref=f20e7]: "Death is not the end. Consciousness does not die — it resonates. The question is only: who will hear it."
  - paragraph [ref=f20e8]:
    - strong [ref=f20e9]: Shimmer
    - text: is a transmedia sci-fi saga about consciousness after death, the Psi-Stream, and two souls that find each other across a thousand years.
  - heading [level=2] [ref=f20e10]:
    - text: The Universe
    - link "Anchor" [ref=f20e11] [cursor=pointer]:
      - /url: "#the-universe"
      - text: 
  - heading [level=3] [ref=f20e12]:
    - text: What Is the Shimmer?
    - link "Anchor" [ref=f20e13] [cursor=pointer]:
      - /url: "#what-is-the-shimmer"
      - text: 
  - paragraph [ref=f20e14]:
    - text: Shimmer is the state of consciousness after physical death where the person continues to exist in the Psi-Stream. It is not an afterlife, not heaven, not reincarnation — it is the
    - strong [ref=f20e15]: trace
    - text: a consciousness leaves behind in the living fabric of the Stream.
  - paragraph [ref=f20e16]:
    - text: When a body dies, the person inside does not notice the transition. They are still
    - emphasis [ref=f20e17]: here
    - text: — only the body is no longer required. They can see, hear, feel — not through organs, but directly, through the Stream.
  - paragraph [ref=f20e18]: "A shimmering consciousness is like a candle flame in total darkness. It stays alight as long as it has fuel:"
  - list [ref=f20e19]:
    - listitem [ref=f20e20]:
      - strong [ref=f20e21]: Memories
      - text: — the richer the life, the longer the Shimmer.
    - listitem [ref=f20e22]:
      - strong [ref=f20e23]: Love
      - text: — being remembered by connected consciousnesses sustains it.
    - listitem [ref=f20e24]:
      - strong [ref=f20e25]: Will
      - text: — the desire to remain. Some hold on longer because they refuse to fade.
  - heading [level=3] [ref=f20e26]:
    - text: Galactic Clock
    - link "Anchor" [ref=f20e27] [cursor=pointer]:
      - /url: "#galactic-clock"
      - text: 
  - paragraph [ref=f20e28]:
    - text: The galaxy completes a full rotation once every
    - strong [ref=f20e29]: 12,000 years
    - text: ", divided into 12"
    - strong [ref=f20e30]: Galactic Hours
    - text: "— 1,000 years each. The Psi-Stream responds to this rotation like an ocean to the Moon:"
  - list [ref=f20e31]:
    - listitem [ref=f20e32]: Each Hour has its own “tide” of the Stream.
    - listitem [ref=f20e33]:
      - text: Each Hour births its own
      - strong [ref=f20e34]: Architect
      - text: — the one who resonates loudest in that time segment.
    - listitem [ref=f20e35]: After 1,000 years, an ordinary Shimmer fades into the deep Stream.
    - listitem [ref=f20e36]:
      - text: After 12,000 years, when the cycle returns to the same phase,
      - strong [ref=f20e37]: every Shimmer of that Hour resumes
      - text: — not reincarnation, but
      - strong [ref=f20e38]: resonance
      - text: .
  - heading [level=3] [ref=f20e39]:
    - text: The Architects
    - link "Anchor" [ref=f20e40] [cursor=pointer]:
      - /url: "#the-architects"
      - text: 
  - paragraph [ref=f20e41]:
    - strong [ref=f20e42]: Lira
    - text: is an Architect at the end of her 1,000-year Shimmer. She spent almost all of it building a Path for
    - strong [ref=f20e43]: Kai
    - text: — a boy from a desert world where the Shimmer is a forgotten knowledge and death means true oblivion. Kai’s dreams are not madness — they are contact.
  - paragraph [ref=f20e44]: "Their meeting in the Shimmer is the rarest and greatest happiness the Stream can offer: two shimmering consciousnesses that found each other."
  - heading [level=2] [ref=f20e45]:
    - text: The Books
    - link "Anchor" [ref=f20e46] [cursor=pointer]:
      - /url: "#the-books"
      - text: 
  - heading [level=3] [ref=f20e47]:
    - text: Book of Kai
    - link "Anchor" [ref=f20e48] [cursor=pointer]:
      - /url: "#book-of-kai"
      - text: 
  - paragraph [ref=f20e49]: Kai lives on a desert world where the Shimmer is forgotten. People die for real — buried in sand, forgotten in a generation. His dreams are bridges to a voice that has been waiting for a thousand years.
  - list [ref=f20e50]:
    - listitem [ref=f20e51]:
      - strong [ref=f20e52]: Status
      - text: ": Complete — 12 chapters."
    - listitem [ref=f20e53]:
      - strong [ref=f20e54]: Language
      - text: ": Russian."
  - heading [level=3] [ref=f20e55]:
    - text: Book of Lira
    - link "Anchor" [ref=f20e56] [cursor=pointer]:
      - /url: "#book-of-lira"
      - text: 
  - paragraph [ref=f20e57]: Lira’s story — from life to Shimmer to the creation of the Path. What she sacrificed, what she built, and who she was before she became a legend.
  - list [ref=f20e58]:
    - listitem [ref=f20e59]:
      - strong [ref=f20e60]: Status
      - text: ": In progress (prologue + chapter 1)."
    - listitem [ref=f20e61]:
