        - heading [level=2] [ref=f11e98]:
          - link "Камень Ответа" [ref=f11e99] [cursor=pointer]:
            - /url: "#камень-ответа"
        - paragraph [ref=f11e100]: Дети называли это место Молчаливыми Стенами.
        - paragraph [ref=f11e101]: Взрослые не называли его никак — просто отводили взгляд, если тропа случайно вела мимо, и ускоряли шаг, будто само направление могло быть услышано. Говорили, что однажды туда залез мальчишка из клана Ловцов Воды и не вышел обратно. Одни клялись, что его забрал песок. Другие — что это он забрал с собой песок, и с того дня дюна у восточной стены больше не двигалась, как будто ветру запретили.
        - paragraph [ref=f11e102]: Кай не верил ни в то, ни в другое. Он приходил сюда каждое утро — не из упрямства и не из отваги, которой у него, по правде, было немного, а потому что здесь, среди осыпавшихся плит, что-то было ему должно.
        - paragraph [ref=f11e103]: Он никому не смог бы объяснить, что именно. Просто иногда, когда ветер menял направление и проходил сквозь трещину в южной стене, камень пел. Не так, как поют люди у ночного костра, и не так, как воет ветер в пустых кувшинах. Это было похоже на голос, который забыл слова, но помнит, что когда-то они у него были.
        - paragraph [ref=f11e104]: "Старейшины сказали бы, что это грех — слушать такое. Что уши даны человеку для слов соседа, для крика погонщика, для голоса духов на празднике урожая, а не для того, чтобы ловить бормотание камня. Слушать себя, говорили они, — вот первая дверь, через которую в человека входит безумие. А безумие в песках не прощают: слишком дорого стоит вода, чтобы тратить её на того, кто разговаривает с пустотой."
        - paragraph [ref=f11e105]: Кай слушал. Тайно. Каждое утро.
        - separator [ref=f11e106]
        - paragraph [ref=f11e107]: В то утро песок ещё хранил ночной холод, а солнце только-только тронуло верхушки руин, выкрасив их в тускло-медный цвет. Кай протиснулся в узкую щель, где стена давно просела, ободрав локоть о каменную кромку, и оказался внутри — там, где тень стояла плотная, как вода в кувшине, и куда снаружи не долетал ни один звук.
        - paragraph [ref=f11e108]: Он замер, привыкая к темноте.
        - paragraph [ref=f11e109]: И тогда увидел блеск.
        - paragraph [ref=f11e110]: "На земле, среди обломков, лежало что-то небольшое — размером с его сжатый кулак, тёмное, но не тусклое, будто камень впитал в себя весь свет, что когда-либо здесь бывал, и теперь нехотя им делился. Форма была странной: не круглая и не гранёная, а вытянутая, с изгибом, похожим то ли на закрытый глаз, то ли на слово, которое кто-то попытался высечь и бросил на середине."
        - paragraph [ref=f11e111]: Кай присел рядом. Долго не решался тронуть.
        - paragraph [ref=f11e112]: — Ты не должен быть здесь, — сказал он вслух, сам не зная, кому. Голос прозвучал слишком громко для этой тишины.
        - paragraph [ref=f11e113]: Камень не ответил. Но в груди у Кая шевельнулось что-то похожее на узнавание — так узнаёшь дом после долгого пути, хотя видишь его впервые.
        - paragraph [ref=f11e114]:
          - emphasis [ref=f11e115]: Он ждал.
        - paragraph [ref=f11e116]: Мысль пришла не изнутри и не снаружи, а будто сбоку, и Кай не был уверен, подумал он это сам или услышал.
        - paragraph [ref=f11e117]: Он протянул руку. Пальцы дрожали — не от страха, а от того, что тело как будто заранее знало то, чего ещё не знал разум. Кончики пальцев коснулись холодной поверхности.
        - separator [ref=f11e118]
        - paragraph [ref=f11e119]: Ветер снаружи замер.
        - paragraph [ref=f11e120]: Кай понял это не слухом, а всем телом — так замечаешь, что сердце внезапно стало слышно. Песок перестал шуршать о стены. Собственное дыхание пропало, будто кто-то забрал у него звук вместе со светом.
        - paragraph [ref=f11e121]: "И вместо боли, которую он всё это время ждал, — потому что так учили: тронешь чужое, спрятанное, и накажут — пришёл сон."
        - separator [ref=f11e122]
        - paragraph [ref=f11e123]: Он увидел башню.
        - paragraph [ref=f11e124]: "Она стояла в пустыне, но не была руиной. Она была живой — Кай не смог бы сказать, откуда взялось это слово, просто знал: стены дышат, в них проступает и гаснет слабый свет, как будто внутри камня кто-то медленно вдыхает и выдыхает."
        - paragraph [ref=f11e125]: Внутри, у самого основания, стоял старик.
        - paragraph [ref=f11e126]: Одет он был просто, почти так же, как одевались в клане Кая — грубая ткань, пыльные сандалии. Но в руках он держал не посох и не чашу для воды, а что-то невидимое глазу, что-то, что дрожало в воздухе между его ладонями и тянулось вверх, к тёмному небу, будто нить.
        - paragraph [ref=f11e127]: "Старик смотрел на звёзды. И говорил — тихо, но так, что слова заполняли собой всё пространство сна:"
        - paragraph [ref=f11e128]: — Я не прошу. Я слышу.
        - paragraph [ref=f11e129]: В тот же миг небо разошлось. Не громом, не пламенем — потоком. Тысячи, миллионы тонких нитей света хлынули вниз, как реки, как голоса, как чьи-то давно забытые сны, и вошли в старика — в его поднятые руки, в грудь, в лицо, запрокинутое к небу.
        - paragraph [ref=f11e130]: Он упал на колени. Заплакал. И одновременно — улыбался, будто боль и радость наконец перестали быть двумя разными вещами.
        - paragraph [ref=f11e131]: — Вы не одни, — сказал он в поток, который его пожирал и наполнял одновременно. — Вы вместе.
        - paragraph [ref=f11e132]: И тогда Кай увидел её.
        - separator [ref=f11e133]
        - paragraph [ref=f11e134]: "Девушка стояла — нет, не стояла: она была частью самого потока, соткана из того же света, что лился с небес. Белое платье, светлые, почти бесцветные волосы, которые казались продолжением сияния, а не отдельно от него."
        - paragraph [ref=f11e135]: Она не смотрела на старика с жалостью. В её взгляде была гордость. И любовь. И что-то ещё — тонкое, застарелое, похожее на печаль человека, который знает конец истории задолго до её начала.
        - paragraph [ref=f11e136]: "Она произнесла что-то — Кай не знал этого языка, ни одного слова из тех, что он мог бы повторить проснувшись, — но понял каждую мысль, будто она вошла в него напрямую, минуя уши:"
        - paragraph [ref=f11e137]:
          - emphasis [ref=f11e138]: Ты первый. Но ты не последний. Он придёт. Он увидит это. Он поймёт.
        - paragraph [ref=f11e139]: А потом она перестала смотреть на старика.
        - paragraph [ref=f11e140]: Она посмотрела на Кая.
        - paragraph [ref=f11e141]: Прямо. Сквозь сон, сквозь года, которых он не мог сосчитать, сквозь то, что отделяло его от неё так надёжно, как ничто в целом мире, — расстояние, для которого ещё не придумали слова.
        - separator [ref=f11e142]
        - paragraph [ref=f11e143]: Кай упал.
        - paragraph [ref=f11e144]: Рука соскочила с камня, и он ударился спиной о холодную стену, хватая ртом воздух, как будто вынырнул с самого дна колодца. Сердце колотилось так, что он слышал его в ушах, в горле, в кончиках пальцев.
        - paragraph [ref=f11e145]: Камень лежал рядом. Тёмный. Неподвижный. Ничего в нём больше не отзывалось.
        - paragraph [ref=f11e146]: "Но Кай знал — знал так же твёрдо, как знал, что солнце встаёт на востоке: то, что он видел, не было сном в том смысле, в котором старейшины ругали сны. Это было. Они — были. И он сам, каким-то образом, тоже был там, среди них, а не только смотрел со стороны."
        - paragraph [ref=f11e147]: Он поднял камень, обернул его лоскутом, оторванным от рубахи, и спрятал у пояса. По дороге домой он не сказал никому ни слова.
        - separator [ref=f11e148]
        - paragraph [ref=f11e149]: С того дня каждую ночь Кай видел один и тот же сон.
        - paragraph [ref=f11e150]: Ту же башню. Того же старика с невидимой нитью в руках. Ту же девушку, стоящую в потоке света, как будто сотканную из него.
        - paragraph [ref=f11e151]: Он не знал, что башня — не просто башня, а Шпиль, о котором в его клане не сохранилось даже легенды. Он не знал, что старик — тот, кого через тысячи лет назовут первым, кто услышал Пси-поток. Он не знал имени девушки.
        - paragraph [ref=f11e152]: "Он знал только одно, и это знание сидело в нём тяжелее любого слова:"
        - paragraph [ref=f11e153]:
          - emphasis [ref=f11e154]: Они знают, что я смотрю.
        - separator [ref=f11e155]
        - paragraph [ref=f11e156]: Он перестал играть с другими детьми у колодца. Перестал слушать байки старших про демонов, что живут под дюнами. Каждое утро уходил к Молчаливым Стенам и подолгу сидел там, ожидая, что камень снова заговорит — но тот молчал, только по ночам, если приложить его к груди, чуть теплел, будто под кожей у него билось что-то очень медленное.
        - paragraph [ref=f11e157]: А ещё Кай начал рисовать.
        - paragraph [ref=f11e158]: "Сперва на песке, пальцем — и стирал, едва солнце показывало ему сделанное. Потом углём, украденным у кузнеца, на обломке доски: башню, старика с поднятыми руками, девушку в потоке света."
        - paragraph [ref=f11e159]: "Мать нашла один такой рисунок под циновкой и долго молчала, разглядывая его в свете очага. Потом сказала только:"
        - paragraph [ref=f11e160]: — Спрячь. И больше не рисуй.
        - paragraph [ref=f11e161]: Но не спросила, что это. Побоялась спросить — потому что если сын видит духов, то либо это дар, о котором нельзя говорить вслух, либо болезнь, за которую наказывают, а между этими двумя ей не хотелось выбирать.
        - paragraph [ref=f11e162]: Кай спрятал доску. Но рисовать не перестал.
        - paragraph [ref=f11e163]: Он не выбирал этот путь — так, по крайней мере, ему казалось. Он просто откликнулся на что-то, что было брошено в его сторону задолго до его рождения и терпеливо ждало, зная, что рано или поздно найдётся тот, кто протянет руку.
        - paragraph [ref=f11e164]: Он ещё не знал её имени.
        - paragraph [ref=f11e165]: Но она уже — с самого первого дня, за тысячи лет вперёд от этой ночи — знала его.
