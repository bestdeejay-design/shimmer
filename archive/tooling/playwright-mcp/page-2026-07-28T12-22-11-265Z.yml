            - /url: "#the-stone-of-answer"
        - paragraph [ref=f3e181]: Children called the place the Silent Walls.
        - paragraph [ref=f3e182]: Adults called it nothing at all — they simply looked away when a path happened to lead past, and quickened their step, as though the direction itself might be overheard. They said a boy from the Water Finders’ clan had once climbed in there and never come out. Some swore the sand had taken him. Others — that he had taken the sand with him, and from that day the dune by the eastern wall had not moved, as though the wind had been forbidden.
        - paragraph [ref=f3e183]: Kai believed neither. He came here every morning — not out of stubbornness, nor out of a courage he did not, in truth, have much of — but because here, among the fallen slabs, something was owed to him.
        - paragraph [ref=f3e184]: He could not have explained to anyone what. Only that sometimes, when the wind shifted and passed through a crack in the southern wall, the stone would sing. Not the way people sing by a night fire, nor the way wind howls in empty jars. It was like a voice that had forgotten the words, but remembered that once it had them.
        - paragraph [ref=f3e185]: "The elders would have called it a sin — to listen to such a thing. That ears were given to a person for the words of a neighbor, the shout of a herder, the voice of spirits at the harvest festival — not for catching the muttering of stone. To listen to oneself, they said, was the first door through which madness entered a person. And madness in the sands was not forgiven: water cost too much to be wasted on one who talked with emptiness."
        - paragraph [ref=f3e186]: Kai listened. In secret. Every morning.
        - separator [ref=f3e187]
        - paragraph [ref=f3e188]: That morning the sand still held the night’s chill, and the sun had only just touched the tops of the ruins, staining them a dim copper. Kai slipped through the narrow gap where the wall had long ago caved in, scraping his elbow on the stone edge, and found himself inside — where the shadow stood thick as water in a jar, and where no sound from outside could reach.
        - paragraph [ref=f3e189]: He stood still, letting his eyes grow used to the dark.
        - paragraph [ref=f3e190]: And then he saw the glint.
        - paragraph [ref=f3e191]: "On the ground, among the rubble, lay something small — the size of his clenched fist, dark but not dull, as though the stone had drunk in all the light that had ever been here, and now grudgingly shared it. Its shape was strange: not round, not faceted, but elongated, with a curve like a closed eye, or like a word someone had tried to carve and abandoned halfway through."
        - paragraph [ref=f3e192]: Kai crouched beside it. For a long time he did not dare to touch it.
        - paragraph [ref=f3e193]: “You shouldn’t be here,” he said aloud, not knowing to whom. His voice sounded too loud for that silence.
        - paragraph [ref=f3e194]: The stone did not answer. But something stirred in Kai’s chest that felt like recognition — the way one recognizes a house after a long journey, though one is seeing it for the first time.
        - paragraph [ref=f3e195]:
          - emphasis [ref=f3e196]: It was waiting.
        - paragraph [ref=f3e197]: The thought came not from inside and not from outside, but from the side, and Kai was not sure whether he had thought it himself or heard it.
        - paragraph [ref=f3e198]: He reached out. His fingers trembled — not from fear, but because his body seemed to know already what his mind did not yet. The tips of his fingers touched the cold surface.
        - separator [ref=f3e199]
        - paragraph [ref=f3e200]: The wind outside stopped.
        - paragraph [ref=f3e201]: Kai knew it not by hearing, but with his whole body — the way one notices one’s own heart suddenly becoming audible. The sand ceased to whisper against the walls. His own breathing disappeared, as though someone had taken sound from him along with the light.
        - paragraph [ref=f3e202]: "And in place of the pain he had been expecting — because that was what he had been taught: touch what is hidden, what is not yours, and you will be punished — a dream came."
        - separator [ref=f3e203]
        - paragraph [ref=f3e204]: He saw a tower.
        - paragraph [ref=f3e205]: "It stood in a desert, but it was no ruin. It was alive — Kai could not have said where the word came from, he simply knew: the walls breathed, a faint light passed through them and faded, as though inside the stone someone was slowly inhaling and exhaling."
        - paragraph [ref=f3e206]: Within, at the very base, stood an old man.
        - paragraph [ref=f3e207]: He was dressed simply, much the way Kai’s own people dressed — coarse cloth, dusty sandals. But in his hands he held not a staff and not a bowl for water, but something invisible to the eye, something that trembled in the air between his palms and stretched upward, toward the dark sky, like a thread.
        - paragraph [ref=f3e208]: "The old man was looking at the stars. And he spoke — quietly, but in such a way that the words filled all the space of the dream:"
        - paragraph [ref=f3e209]: “I do not ask. I hear.”
        - paragraph [ref=f3e210]: In the same instant the sky split. Not with thunder, not with fire — with a Stream. Thousands, millions of thin threads of light poured down, like rivers, like voices, like someone’s long-forgotten dreams, and entered the old man — into his raised hands, into his chest, into his face thrown back to the sky.
        - paragraph [ref=f3e211]: He fell to his knees. He wept. And at the same time — he smiled, as though pain and joy had at last ceased to be two different things.
        - paragraph [ref=f3e212]: “You are not alone,” he said into the Stream that was devouring and filling him at once. “You are together.”
        - paragraph [ref=f3e213]: And then Kai saw her.
        - separator [ref=f3e214]
        - paragraph [ref=f3e215]: "The girl was standing — no, not standing: she was part of the stream itself, woven of the same light that poured from the heavens. A white dress, pale, almost colorless hair, which seemed to be a continuation of the radiance rather than separate from it."
        - paragraph [ref=f3e216]: She did not look at the old man with pity. In her gaze there was pride. And love. And something else — fine, long-standing, like the sorrow of a person who knows the end of a story long before its beginning.
        - paragraph [ref=f3e217]: "She said something — Kai knew none of that language, not a single word he could have repeated upon waking — but he understood every thought, as though it had entered him directly, bypassing the ears:"
        - paragraph [ref=f3e218]:
          - emphasis [ref=f3e219]: You are the first. But you are not the last. He will come. He will see this. He will understand.
        - paragraph [ref=f3e220]: And then she stopped looking at the old man.
        - paragraph [ref=f3e221]: She looked at Kai.
        - paragraph [ref=f3e222]: Directly. Through the dream, through the years he could not count, through whatever separated him from her as surely as nothing in the whole world — a distance for which no word had yet been invented.
        - separator [ref=f3e223]
        - paragraph [ref=f3e224]: Kai fell.
        - paragraph [ref=f3e225]: His hand slipped from the stone, and he struck his back against the cold wall, gasping for air as though he had surfaced from the very bottom of a well. His heart beat so hard he heard it in his ears, in his throat, in the tips of his fingers.
        - paragraph [ref=f3e226]: The stone lay beside him. Dark. Still. Nothing in it answered anymore.
        - paragraph [ref=f3e227]: "But Kai knew — knew as surely as he knew that the sun rises in the east: what he had seen was not a dream in the way the elders cursed dreams. It had been. They — had been. And he himself, in some way, had also been there among them, not merely watching from the side."
        - paragraph [ref=f3e228]: He picked up the stone, wrapped it in a strip torn from his shirt, and hid it at his waist. On the way home he did not speak a word to anyone.
        - separator [ref=f3e229]
        - paragraph [ref=f3e230]: From that day, every night, Kai saw the same dream.
        - paragraph [ref=f3e231]: The same tower. The same old man with the invisible thread in his hands. The same girl standing in the stream of light, as though woven of it.
        - paragraph [ref=f3e232]: He did not know that the tower was not merely a tower, but the Spire, of which no legend survived in his clan. He did not know that the old man was the one who, thousands of years later, would be called the first to hear the Psi-Stream. He did not know the girl’s name.
        - paragraph [ref=f3e233]: "He knew only one thing, and this knowledge sat in him heavier than any word:"
        - paragraph [ref=f3e234]:
          - emphasis [ref=f3e235]: They know I am watching.
        - separator [ref=f3e236]
        - paragraph [ref=f3e237]: He stopped playing with the other children at the well. He stopped listening to the elders’ tales of demons that lived beneath the dunes. Every morning he went to the Silent Walls and sat there a long time, waiting for the stone to speak again — but it was silent, only at night, if he pressed it to his chest, did it grow faintly warm, as though beneath its skin something very slow was beating.
        - paragraph [ref=f3e238]: And Kai began to draw.
        - paragraph [ref=f3e239]: "At first in the sand, with a finger — and he would erase it as soon as the sun showed him what he had done. Then with charcoal, stolen from the smith, on a fragment of board: the tower, the old man with raised hands, the girl in the stream of light."
        - paragraph [ref=f3e240]: "His mother found one such drawing under a mat and was silent for a long time, studying it in the light of the hearth. Then she said only:"
        - paragraph [ref=f3e241]: “Hide it. And do not draw anymore.”
        - paragraph [ref=f3e242]: But she did not ask what it was. She was afraid to ask — because if a son sees spirits, then either it is a gift that must not be spoken of aloud, or it is an illness for which one is punished, and between these two she did not wish to choose.
        - paragraph [ref=f3e243]: Kai hid the board. But he did not stop drawing.
        - paragraph [ref=f3e244]: He had not chosen this path — so, at least, it seemed to him. He had simply answered something that had been thrown in his direction long before his birth, and that had waited patiently, knowing that sooner or later someone would reach out a hand.
        - paragraph [ref=f3e245]: He did not yet know her name.
        - paragraph [ref=f3e246]: But she — from the very first day, thousands of years ahead of that night — already knew his.
