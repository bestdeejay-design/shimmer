- generic [ref=f21e2]:
  - heading [level=1] [ref=f21e3]:
    - link "shimmer" [ref=f21e4] [cursor=pointer]:
      - /url: https://bestdeejay-design.github.io/shimmer/
  - heading "Shimmer" [level=1] [ref=f21e5]
  - blockquote [ref=f21e6]:
    - paragraph [ref=f21e7]: "Death is not the end. Consciousness does not die — it resonates. The question is only: who will hear it."
  - paragraph [ref=f21e8]:
    - strong [ref=f21e9]: Shimmer
    - text: is a transmedia sci-fi saga about consciousness after death, the Psi-Stream, and two souls that find each other across a thousand years.
  - heading [level=2] [ref=f21e10]:
    - text: The Universe
    - link "Anchor" [ref=f21e11] [cursor=pointer]:
      - /url: "#the-universe"
      - text: 
  - heading [level=3] [ref=f21e12]:
    - text: What Is the Shimmer?
    - link "Anchor" [ref=f21e13] [cursor=pointer]:
      - /url: "#what-is-the-shimmer"
      - text: 
  - paragraph [ref=f21e14]:
    - text: Shimmer is the state of consciousness after physical death where the person continues to exist in the Psi-Stream. It is not an afterlife, not heaven, not reincarnation — it is the
    - strong [ref=f21e15]: trace
    - text: a consciousness leaves behind in the living fabric of the Stream.
  - paragraph [ref=f21e16]:
    - text: When a body dies, the person inside does not notice the transition. They are still
    - emphasis [ref=f21e17]: here
    - text: — only the body is no longer required. They can see, hear, feel — not through organs, but directly, through the Stream.
  - paragraph [ref=f21e18]: "A shimmering consciousness is like a candle flame in total darkness. It stays alight as long as it has fuel:"
  - list [ref=f21e19]:
    - listitem [ref=f21e20]:
      - strong [ref=f21e21]: Memories
      - text: — the richer the life, the longer the Shimmer.
    - listitem [ref=f21e22]:
      - strong [ref=f21e23]: Love
      - text: — being remembered by connected consciousnesses sustains it.
    - listitem [ref=f21e24]:
      - strong [ref=f21e25]: Will
      - text: — the desire to remain. Some hold on longer because they refuse to fade.
  - heading [level=3] [ref=f21e26]:
    - text: Galactic Clock
    - link "Anchor" [ref=f21e27] [cursor=pointer]:
      - /url: "#galactic-clock"
      - text: 
  - paragraph [ref=f21e28]:
    - text: The galaxy completes a full rotation once every
    - strong [ref=f21e29]: 12,000 years
    - text: ", divided into 12"
    - strong [ref=f21e30]: Galactic Hours
    - text: "— 1,000 years each. The Psi-Stream responds to this rotation like an ocean to the Moon:"
  - list [ref=f21e31]:
    - listitem [ref=f21e32]: Each Hour has its own “tide” of the Stream.
    - listitem [ref=f21e33]:
      - text: Each Hour births its own
      - strong [ref=f21e34]: Architect
      - text: — the one who resonates loudest in that time segment.
    - listitem [ref=f21e35]: After 1,000 years, an ordinary Shimmer fades into the deep Stream.
    - listitem [ref=f21e36]:
      - text: After 12,000 years, when the cycle returns to the same phase,
      - strong [ref=f21e37]: every Shimmer of that Hour resumes
      - text: — not reincarnation, but
      - strong [ref=f21e38]: resonance
      - text: .
  - heading [level=3] [ref=f21e39]:
    - text: The Architects
    - link "Anchor" [ref=f21e40] [cursor=pointer]:
      - /url: "#the-architects"
      - text: 
  - paragraph [ref=f21e41]:
    - strong [ref=f21e42]: Lira
    - text: is an Architect at the end of her 1,000-year Shimmer. She spent almost all of it building a Path for
    - strong [ref=f21e43]: Kai
    - text: — a boy from a desert world where the Shimmer is a forgotten knowledge and death means true oblivion. Kai’s dreams are not madness — they are contact.
  - paragraph [ref=f21e44]: "Their meeting in the Shimmer is the rarest and greatest happiness the Stream can offer: two shimmering consciousnesses that found each other."
  - heading [level=2] [ref=f21e45]:
    - text: The Books
    - link "Anchor" [ref=f21e46] [cursor=pointer]:
      - /url: "#the-books"
      - text: 
  - heading [level=3] [ref=f21e47]:
    - text: Book of Kai
    - link "Anchor" [ref=f21e48] [cursor=pointer]:
      - /url: "#book-of-kai"
      - text: 
  - paragraph [ref=f21e49]: Kai lives on a desert world where the Shimmer is forgotten. People die for real — buried in sand, forgotten in a generation. His dreams are bridges to a voice that has been waiting for a thousand years.
  - list [ref=f21e50]:
    - listitem [ref=f21e51]:
      - strong [ref=f21e52]: Status
      - text: ": Complete — 12 chapters."
    - listitem [ref=f21e53]:
      - strong [ref=f21e54]: Language
      - text: ": Russian."
  - heading [level=3] [ref=f21e55]:
    - text: Book of Lira
    - link "Anchor" [ref=f21e56] [cursor=pointer]:
      - /url: "#book-of-lira"
      - text: 
  - paragraph [ref=f21e57]: Lira’s story — from life to Shimmer to the creation of the Path. What she sacrificed, what she built, and who she was before she became a legend.
  - list [ref=f21e58]:
    - listitem [ref=f21e59]:
      - strong [ref=f21e60]: Status
      - text: ": In progress (prologue + chapter 1)."
    - listitem [ref=f21e61]:
      - strong [ref=f21e62]: Language
      - text: ": Russian."
  - heading [level=3] [ref=f21e63]:
    - text: Lore Files
    - link "Anchor" [ref=f21e64] [cursor=pointer]:
      - /url: "#lore-files"
      - text: 
  - paragraph [ref=f21e65]: Seven reference documents covering the Psi-Stream, Shimmer mechanics, the Galactic Clock, the Architects, and the structure of the universe.
